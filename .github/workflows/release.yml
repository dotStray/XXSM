name: Release

# Started by hand: Actions → Release → Run workflow, with the version typed in. It builds the Linux AppImage and the
# Windows exe from the commit it runs on, starts each on a clean machine (Ubuntu, Arch, Windows) and, if every one
# opens its window, attaches them to a draft release. Nothing is public until the draft's notes are written and it is
# published on the Releases page.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to release, such as 1.0.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CI: true
  VERSION: ${{ inputs.version }}

jobs:
  build:
    name: Build the downloads
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check the version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' is not a version like 1.0.1."
            exit 1
          fi
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::There is already a release v$VERSION."
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build -c Release -p:Version="$VERSION"

      - name: Build the AppImage
        run: packaging/linux/build-appimage.sh "$VERSION" artifacts

      - name: Build the Windows exe
        run: packaging/windows/build-exe.sh "$VERSION" artifacts

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: downloads
          path: artifacts/
          if-no-files-found: error

  linux:
    name: Start the AppImage on ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "archlinux:latest"]

    steps:
      - name: Install a virtual display
        run: |
          if command -v apt-get > /dev/null; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              xvfb xauth ca-certificates libfontconfig1 libice6 libsm6
          else
            pacman -Syu --noconfirm --needed xorg-server-xvfb xorg-xauth fontconfig libice libsm
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: downloads
          path: artifacts

      - name: Start it and wait for the window
        run: packaging/linux/smoke-test.sh "artifacts/XXSM-$VERSION-x86_64.AppImage"

  windows:
    name: Start the exe on Windows
    needs: build
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: downloads
          path: artifacts

      - name: Start it and wait for the window
        shell: pwsh
        run: ./packaging/windows/smoke-test.ps1 -Exe "artifacts/XXSM-$env:VERSION-x64.exe"

  draft:
    name: Make the draft release
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: downloads
          path: artifacts

      - name: Make the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "XXSM $VERSION" \
            --notes "Release notes to be written before publishing." \
            --draft
